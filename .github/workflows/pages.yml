# Publica a pasta site/ no GitHub Pages a cada push na main.
# Antes de publicar, roda o validador: se houver senha, Wi-Fi ou texto sem tradução, nada é publicado.
name: Publicar guia
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes do validador
        run: cd tools && python -m unittest test_validar
      - name: Validar dados
        run: python tools/validar.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
